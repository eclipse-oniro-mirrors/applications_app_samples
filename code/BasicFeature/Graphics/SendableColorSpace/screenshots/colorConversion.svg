<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: sans-serif; fill: #111111; font-weight: bold; }
      .text-body { font-family: sans-serif; fill: #333333; }
      .text-sub { font-family: sans-serif; fill: #666666; }
      .btn-primary { fill: #007DFF; }
      .btn-label { font-family: sans-serif; fill: #ffffff; font-size: 22px; }
      .chip { fill: #E8E8E8; }
      .chip-text { font-family: sans-serif; fill: #3C3C3C; font-size: 19px; }
      .chip-text-on { font-family: sans-serif; fill: #ffffff; font-size: 19px; }
      .status-text { font-family: sans-serif; fill: #333333; font-size: 24px; font-weight: 500; }
      .row { fill: #F5F5F5; }
      .row-tint { fill: #EAF4FF; }
      .row-text { font-family: sans-serif; fill: #333333; font-size: 20px; }
      .nav-icon { fill: none; stroke: #333333; stroke-width: 3; }
    </style>
  </defs>

  <rect width="720" height="1280" class="bg" />

  <!-- 状态栏 -->
  <text x="44" y="46" class="status-text">没有 SIM 卡</text>
  <rect x="198" y="36" width="5" height="10" fill="#333333" />
  <rect x="206" y="32" width="5" height="14" fill="#333333" />
  <rect x="214" y="27" width="5" height="19" fill="#333333" />
  <rect x="222" y="22" width="5" height="24" fill="#999999" />
  <text x="534" y="46" class="status-text">11%</text>
  <rect x="580" y="26" width="26" height="14" rx="3" fill="none" stroke="#333333" stroke-width="2" />
  <rect x="583" y="29" width="4" height="8" fill="#0E9F57" />
  <rect x="608" y="30" width="3" height="6" fill="#333333" />
  <text x="634" y="46" class="status-text">06:26</text>

  <!-- 标题栏 -->
  <rect x="18" y="165" width="117" height="50" rx="25" class="btn-primary" />
  <text x="76" y="198" class="btn-label" text-anchor="middle">&lt; Back</text>
  <text x="152" y="202" class="text-title" font-size="27">Color Space Conversion</text>

  <!-- 源色域 -->
  <text x="360" y="248" class="text-sub" font-size="22" text-anchor="middle">Source:SRGB</text>
  <text x="360" y="287" class="text-body" font-size="24" text-anchor="middle">Source space</text>

  <rect x="60" y="305" width="88" height="38" rx="19" class="btn-primary" />
  <text x="104" y="331" class="chip-text-on" text-anchor="middle">SRGB</text>
  <rect x="154" y="305" width="124" height="38" rx="19" class="chip" />
  <text x="216" y="331" class="chip-text" text-anchor="middle">Display_P3</text>
  <rect x="285" y="305" width="100" height="38" rx="19" class="chip" />
  <text x="335" y="331" class="chip-text" text-anchor="middle">DCI_P3</text>
  <rect x="392" y="305" width="126" height="38" rx="19" class="chip" />
  <text x="455" y="331" class="chip-text" text-anchor="middle">BT2020_HLG</text>
  <rect x="524" y="305" width="136" height="38" rx="19" class="chip" />
  <text x="592" y="331" class="chip-text" text-anchor="middle">BT2020_PQ</text>

  <rect x="154" y="353" width="81" height="38" rx="19" class="chip" />
  <text x="195" y="379" class="chip-text" text-anchor="middle">BT709</text>
  <rect x="243" y="353" width="152" height="38" rx="19" class="chip" />
  <text x="319" y="379" class="chip-text" text-anchor="middle">Adobe_RGB_1998</text>
  <rect x="402" y="353" width="165" height="38" rx="19" class="chip" />
  <text x="485" y="379" class="chip-text" text-anchor="middle">Linear_SRGB</text>

  <!-- 目标色域 -->
  <text x="360" y="430" class="text-sub" font-size="22" text-anchor="middle">Destination:Display_P3</text>
  <text x="360" y="469" class="text-body" font-size="24" text-anchor="middle">Destination space</text>

  <rect x="60" y="486" width="80" height="38" rx="19" class="chip" />
  <text x="100" y="512" class="chip-text" text-anchor="middle">SRGB</text>
  <rect x="152" y="486" width="126" height="38" rx="19" class="btn-primary" />
  <text x="215" y="512" class="chip-text-on" text-anchor="middle">Display_P3</text>
  <rect x="285" y="486" width="100" height="38" rx="19" class="chip" />
  <text x="335" y="512" class="chip-text" text-anchor="middle">DCI_P3</text>
  <rect x="392" y="486" width="126" height="38" rx="19" class="chip" />
  <text x="455" y="512" class="chip-text" text-anchor="middle">BT2020_HLG</text>
  <rect x="524" y="486" width="136" height="38" rx="19" class="chip" />
  <text x="592" y="512" class="chip-text" text-anchor="middle">BT2020_PQ</text>

  <rect x="154" y="534" width="81" height="38" rx="19" class="chip" />
  <text x="195" y="560" class="chip-text" text-anchor="middle">BT709</text>
  <rect x="243" y="534" width="152" height="38" rx="19" class="chip" />
  <text x="319" y="560" class="chip-text" text-anchor="middle">Adobe_RGB_1998</text>
  <rect x="402" y="534" width="165" height="38" rx="19" class="chip" />
  <text x="485" y="560" class="chip-text" text-anchor="middle">Linear_SRGB</text>

  <!-- 测试色 -->
  <text x="360" y="620" class="text-body" font-size="24" text-anchor="middle">Test colors</text>

  <rect x="84" y="638" width="84" height="38" rx="19" fill="#0E9F57" />
  <text x="126" y="664" class="chip-text-on" text-anchor="middle">Red</text>
  <rect x="176" y="638" width="82" height="38" rx="19" class="chip" />
  <text x="217" y="664" class="chip-text" text-anchor="middle">Green</text>
  <rect x="264" y="638" width="82" height="38" rx="19" class="chip" />
  <text x="305" y="664" class="chip-text" text-anchor="middle">Blue</text>
  <rect x="354" y="638" width="84" height="38" rx="19" class="chip" />
  <text x="396" y="664" class="chip-text" text-anchor="middle">White</text>
  <rect x="444" y="638" width="78" height="38" rx="19" class="chip" />
  <text x="483" y="664" class="chip-text" text-anchor="middle">Gray</text>
  <rect x="530" y="638" width="106" height="38" rx="19" class="chip" />
  <text x="583" y="664" class="chip-text" text-anchor="middle">Orange</text>

  <!-- 操作按钮 -->
  <rect x="18" y="695" width="203" height="55" rx="27" class="btn-primary" />
  <text x="119" y="730" class="btn-label" text-anchor="middle">Convert</text>
  <rect x="259" y="695" width="203" height="55" rx="27" class="btn-primary" />
  <text x="360" y="730" class="btn-label" text-anchor="middle">Swap</text>
  <rect x="500" y="695" width="202" height="55" rx="27" class="btn-primary" />
  <text x="601" y="730" class="btn-label" text-anchor="middle">Reset</text>

  <!-- 转换结果 -->
  <rect x="36" y="769" width="648" height="33" rx="6" class="row" />
  <text x="50" y="792" class="row-text">Input:#ff0000</text>

  <rect x="36" y="820" width="648" height="33" rx="6" class="row" />
  <text x="50" y="843" class="row-text">XYZ:X=0.4124 Y=0.2126 Z=0.0193</text>

  <rect x="36" y="871" width="648" height="33" rx="6" class="row" />
  <text x="50" y="894" class="row-text">Lab:L=53.24 a=80.09 b=67.20</text>

  <rect x="36" y="922" width="648" height="33" rx="6" class="row-tint" />
  <text x="50" y="945" class="row-text">Encoded:(233, 54, 40)</text>

  <rect x="36" y="973" width="648" height="33" rx="6" class="row-tint" />
  <text x="50" y="996" class="row-text">Clipped:(233, 54, 40)</text>

  <rect x="36" y="1024" width="648" height="33" rx="6" class="row-tint" />
  <text x="360" y="1047" class="row-text" text-anchor="middle">Status:InGamut</text>

  <!-- 底部系统导航 -->
  <polygon points="196,1243 218,1227 218,1259" class="nav-icon" />
  <circle cx="360" cy="1242" r="13" class="nav-icon" />
  <rect x="502" y="1230" width="24" height="24" rx="2" class="nav-icon" />
</svg>

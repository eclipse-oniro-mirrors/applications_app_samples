<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: sans-serif; fill: #111111; font-weight: bold; }
      .text-sub { font-family: sans-serif; fill: #666666; }
      .btn-primary { fill: #007DFF; }
      .status-text { font-family: sans-serif; fill: #333333; font-size: 24px; font-weight: 500; }
      .btn-label { font-family: sans-serif; fill: #ffffff; font-size: 26px; }
      .nav-icon { fill: none; stroke: #333333; stroke-width: 3; }
    </style>
  </defs>

  <rect width="720" height="1280" class="bg" />

  <!-- 状态栏 -->
  <text x="44" y="46" class="status-text">没有 SIM 卡</text>
  <rect x="198" y="36" width="5" height="10" fill="#333333" />
  <rect x="206" y="32" width="5" height="14" fill="#333333" />
  <rect x="214" y="27" width="5" height="19" fill="#333333" />
  <rect x="222" y="22" width="5" height="24" fill="#999999" />
  <text x="534" y="46" class="status-text">11%</text>
  <rect x="580" y="26" width="26" height="14" rx="3" fill="none" stroke="#333333" stroke-width="2" />
  <rect x="583" y="29" width="4" height="8" fill="#0E9F57" />
  <rect x="608" y="30" width="3" height="6" fill="#333333" />
  <text x="634" y="46" class="status-text">06:25</text>

  <!-- 标题区 -->
  <text x="360" y="224" class="text-title" font-size="42" text-anchor="middle">可共享色彩管理</text>
  <text x="360" y="266" class="text-sub" font-size="24" text-anchor="middle">Sendable 色域管理示例工程</text>

  <!-- 九个功能入口 -->
  <rect x="146" y="300" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="345" class="btn-label" text-anchor="middle">标准色域</text>

  <rect x="146" y="390" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="435" class="btn-label" text-anchor="middle">自定义色域</text>

  <rect x="146" y="480" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="525" class="btn-label" text-anchor="middle">并发场景</text>

  <rect x="146" y="570" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="615" class="btn-label" text-anchor="middle">异常处理</text>

  <rect x="146" y="660" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="705" class="btn-label" text-anchor="middle">色度图</text>

  <rect x="146" y="750" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="795" class="btn-label" text-anchor="middle">色差计算</text>

  <rect x="146" y="840" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="885" class="btn-label" text-anchor="middle">色彩转换</text>

  <rect x="146" y="930" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="975" class="btn-label" text-anchor="middle">并发基准</text>

  <rect x="146" y="1020" width="430" height="72" rx="36" class="btn-primary" />
  <text x="360" y="1065" class="btn-label" text-anchor="middle">色域报告</text>

  <!-- 底部系统导航 -->
  <polygon points="196,1243 218,1227 218,1259" class="nav-icon" />
  <circle cx="360" cy="1242" r="13" class="nav-icon" />
  <rect x="502" y="1230" width="24" height="24" rx="2" class="nav-icon" />
</svg>

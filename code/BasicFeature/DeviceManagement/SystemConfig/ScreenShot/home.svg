<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #f5f6f8; }
            .card { fill: #ffffff; rx: 12; }
            .text-main { font-family: -apple-system, sans-serif; fill: #1a1a1a; }
            .text-sub { font-family: -apple-system, sans-serif; fill: #666666; }
            .text-gray { font-family: -apple-system, sans-serif; fill: #999999; }
            .icon-blue { fill: #0a59f7; }
        </style>
    </defs>

    <!-- 状态栏与背景 -->
    <rect width="360" height="780" class="bg"/>
    <text x="20" y="30" class="text-main" font-size="14">没有 SIM 卡 <tspan font-size="10">📶</tspan></text>
    <text x="340" y="30" class="text-main" font-size="14" text-anchor="end">11% 🔋 19:30</text>

    <!-- 标题 -->
    <text x="180" y="85" class="text-main" font-size="20" font-weight="bold" text-anchor="middle">系统配置示例</text>

    <!-- 顶部说明卡片 -->
    <rect x="0" y="110" width="360" height="160" class="card" rx="0"/>
    <text x="20" y="145" class="text-main" font-size="16" font-weight="bold">SystemConfig 示例</text>
    <text x="20" y="175" class="text-sub" font-size="14">
        <tspan x="20" dy="0">本示例演示 Basic Services Kit 中的定制配置、情景模式和设置信息接</tspan>
        <tspan x="20" dy="22">口。</tspan>
    </text>
    <text x="20" y="225" class="text-gray" font-size="13">API: 26    BundleName: com.samples.systemconfig</text>

    <!-- 列表项 1 -->
    <rect x="15" y="285" width="330" height="75" class="card"/>
    <rect x="30" y="300" width="32" height="32" rx="6" class="icon-blue"/>
    <path d="M38 310 h16 v2 h-16 z M38 316 h16 v2 h-16 z M38 322 h10 v2 h-10 z" fill="#ffffff"/>
    <text x="75" y="315" class="text-main" font-size="16" font-weight="bold">定制配置</text>
    <text x="75" y="340" class="text-sub" font-size="12">获取设备渠道标识符 (customConfig.getChannelId)</text>
    <path d="M325 315 L330 322 L325 329" fill="none" stroke="#cccccc" stroke-width="2"/>

    <!-- 列表项 2 -->
    <rect x="15" y="375" width="330" height="75" class="card"/>
    <rect x="30" y="390" width="32" height="32" rx="6" class="icon-blue"/>
    <path d="M40 398 v16 a4 4 0 0 0 8 0 v-16 z" fill="#ffffff"/>
    <text x="75" y="405" class="text-main" font-size="16" font-weight="bold">情景模式</text>
    <text x="75" y="430" class="text-sub" font-size="12">查询免打扰状态和通知允许状态 (intelligentScene)</text>
    <path d="M325 405 L330 412 L325 419" fill="none" stroke="#cccccc" stroke-width="2"/>

    <!-- 列表项 3 -->
    <rect x="15" y="465" width="330" height="75" class="card"/>
    <rect x="30" y="480" width="32" height="32" rx="6" class="icon-blue"/>
    <circle cx="46" cy="492" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M46 492 L52 498 M46 492 L40 498" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="495" class="text-main" font-size="16" font-weight="bold">设置信息</text>
    <text x="75" y="520" class="text-sub" font-size="12">打开系统设置页面和查询双击应用 (settingsLite)</text>
    <path d="M325 495 L330 502 L325 509" fill="none" stroke="#cccccc" stroke-width="2"/>

    <!-- 底部导航栏 -->
    <polygon points="110,750 120,760 100,760" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="180" cy="755" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="245" y="747" width="14" height="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
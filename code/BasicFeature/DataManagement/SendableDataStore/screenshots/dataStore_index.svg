<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1450" width="800" height="1450">
  <defs>
    <style>
      .bg { fill: #f4f5f9; }
      .text-dark { fill: #191c1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-sub { fill: #5f6368; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .btn { fill: #007bff; rx: 35; }
      .status-bar { fill: #5f6368; font-family: monospace; font-size: 22px; }
      .title-lg { font-size: 46px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-size: 23px; text-anchor: middle; }
      .section-title { font-size: 28px; font-weight: 600; }
      .btn-text { font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1450" class="bg" />

  <!-- Status Bar -->
  <text x="30" y="45" class="status-bar">没有 SIM 卡 *</text>
  <text x="620" y="45" class="status-bar">11% 🔋  08:42</text>

  <!-- Header -->
  <text x="400" y="200" class="text-dark title-lg">Sendable Data Store</text>
  <text x="400" y="255" class="text-sub subtitle">Explore shared preferences and shared relational store APIs.</text>

  <!-- Section: Data Storage -->
  <text x="40" y="330" class="text-dark section-title">Data Storage</text>
  <rect x="40" y="360" width="720" height="80" class="btn" />
  <text x="400" y="410" class="text-white btn-text">Shared Preferences</text>
  
  <rect x="40" y="460" width="720" height="80" class="btn" />
  <text x="400" y="510" class="text-white btn-text">Shared Relational Store</text>

  <!-- Section: Data Collections -->
  <text x="40" y="600" class="text-dark section-title">Data Collections</text>
  <rect x="40" y="630" width="720" height="80" class="btn" />
  <text x="400" y="680" class="text-white btn-text">Sendable Array</text>

  <rect x="40" y="730" width="720" height="80" class="btn" />
  <text x="400" y="780" class="text-white btn-text">Sendable Map</text>

  <rect x="40" y="830" width="720" height="80" class="btn" />
  <text x="400" y="880" class="text-white btn-text">Sendable Queue</text>

  <rect x="40" y="930" width="720" height="80" class="btn" />
  <text x="400" y="980" class="text-white btn-text">Sendable Record</text>

  <!-- Section: Advanced Features -->
  <text x="40" y="1070" class="text-dark section-title">Advanced Features</text>
  <rect x="40" y="1100" width="720" height="80" class="btn" />
  <text x="400" y="1150" class="text-white btn-text">Data Migration</text>

  <rect x="40" y="1200" width="720" height="80" class="btn" />
  <text x="400" y="1250" class="text-white btn-text">Data Backup</text>

  <rect x="40" y="1300" width="720" height="80" class="btn" />
  <text x="400" y="1350" class="text-white btn-text">Data Encryption</text>
  
  <!-- Partial button at bottom -->
  <rect x="40" y="1400" width="720" height="30" class="btn" />

  <!-- Navigation Bar -->
  <path d="M 300 1420 L 330 1390 L 360 1420 Z" fill="none" stroke="#191c1f" stroke-width="3"/>
  <circle cx="400" cy="1405" r="15" fill="none" stroke="#191c1f" stroke-width="3"/>
  <rect x="520" y="1390" width="30" height="30" fill="none" stroke="#191c1f" stroke-width="3"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">	<!-- 深蓝色圆角背景 -->	<rect x="0" y="0" width="1024" height="1024" rx="240" ry="240" fill="#1863ed"/>	<!-- 左上角浅蓝色方块 -->	<rect x="170" y="170" width="295" height="295" rx="55" ry="55" fill="#a9cdfb"/>	<!-- 右上角浅蓝色方块 -->	<rect x="555" y="170" width="295" height="295" rx="55" ry="55" fill="#a9cdfb"/>	<!-- 左下角浅蓝色方块 -->	<rect x="170" y="555" width="295" height="295" rx="55" ry="55" fill="#a9cdfb"/>	<!-- 右下角稍深一点的浅蓝色方块 -->	<rect x="555" y="555" width="295" height="295" rx="55" ry="55" fill="#6e9df6"/></svg>
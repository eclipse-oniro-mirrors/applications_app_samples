<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f2f2f2; }
      .card { fill: #ffffff; rx: 16px; }
      .text-title { font-family: sans-serif; fill: #111111; font-weight: bold; }
      .text-main { font-family: sans-serif; fill: #333333; }
      .text-sub { font-family: sans-serif; fill: #666666; }
      .text-blue { font-family: sans-serif; fill: #007DFF; }
      .btn-primary { fill: #007DFF; rx: 40px; }
      .btn-disabled { fill: #e5e5e5; rx: 40px; }
      .status-bar { fill: #f2f2f2; }
      .status-text { font-family: sans-serif; fill: #000; font-size: 22px; font-weight: 500; }
    </style>
  </defs>
  
  <rect width="720" height="1280" class="bg" />
  
  <!-- 状态栏 -->
  <text x="30" y="45" class="status-text">没有 SIM 卡 📶</text>
  <text x="580" y="45" class="status-text">11% 🔋 00:18</text>

  <!-- 标题区 -->
  <text x="30" y="120" class="text-title" font-size="40">锁屏敏感数据管理</text>
  <text x="30" y="170" class="text-sub" font-size="22">申请、释放并查询锁屏下本应用敏感数据的访问权限。</text>

  <!-- 卡片1：调用前提 -->
  <rect x="25" y="200" width="670" height="400" class="card" />
  <text x="55" y="250" class="text-title" font-size="28">调用前提</text>
  <text x="55" y="290" class="text-sub" font-size="22">需声明</text>
  <text x="55" y="325" class="text-sub" font-size="22">ohos.permission.PROTECT_SCREEN_LOCK_DATA 权</text>
  <text x="55" y="360" class="text-sub" font-size="22">限，并在 queryAppKeyState 返回 KEY_EXIST 时调用</text>
  <text x="55" y="395" class="text-sub" font-size="22">acquireAccess。</text>
  <text x="55" y="440" class="text-sub" font-size="22">DataType: MEDIA_DATA = 0x00000001; ALL_DATA =</text>
  <text x="55" y="475" class="text-sub" font-size="22">0xffffffff。</text>
  <text x="55" y="520" class="text-sub" font-size="22">每次成功调用 acquireAccess 后，都需要配对调用</text>
  <text x="55" y="555" class="text-sub" font-size="22">releaseAccess。</text>

  <!-- 卡片2：DataType 枚举值 -->
  <rect x="25" y="620" width="670" height="150" class="card" />
  <text x="55" y="670" class="text-title" font-size="28">DataType 枚举值</text>
  <text x="55" y="710" class="text-sub" font-size="22">MEDIA_DATA = 1 (0x00000001)</text>
  <text x="55" y="745" class="text-sub" font-size="22">ALL_DATA = -1 (0xffffffff)</text>

  <!-- 按钮组 -->
  <rect x="30" y="790" width="660" height="70" class="btn-primary" />
  <text x="360" y="835" font-family="sans-serif" fill="#ffffff" font-size="26" text-anchor="middle">查询应用密钥状态</text>

  <rect x="30" y="880" width="660" height="70" class="btn-primary" />
  <text x="360" y="925" font-family="sans-serif" fill="#ffffff" font-size="26" text-anchor="middle">申请锁屏访问权限</text>

  <rect x="30" y="970" width="660" height="70" class="btn-disabled" />
  <text x="360" y="1015" class="text-blue" font-size="26" text-anchor="middle">释放锁屏访问权限</text>

  <!-- 底部导航 -->
  <rect x="0" y="1200" width="720" height="80" fill="#ffffff" />
  <polygon points="190,1240 210,1225 210,1255" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="360" cy="1240" r="14" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="500" y="1225" width="24" height="24" fill="none" stroke="#333" stroke-width="3" rx="2"/>
</svg>
<!-- [Start html_tel_intercept] -->
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>tel Scheme Intercept Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        a { display: block; margin: 10px 0; font-size: 18px; color: #007DFF; }
    </style>
</head>
<body>
    <h3>点击下方链接测试 tel: 协议拦截</h3>
    <a href="tel:123456">拨打 123456</a>
    <a href="tel:10086">拨打 10086</a>
    <script>
        // 阻止 <a> 标签默认导航行为，通过 javaScriptProxy 调用原生拨号
        document.querySelectorAll('a[href^="tel:"]').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                interceptProxy.interceptPrompt(this.href);
            });
        });
    </script>
</body>
</html>
<!-- [End html_tel_intercept] -->

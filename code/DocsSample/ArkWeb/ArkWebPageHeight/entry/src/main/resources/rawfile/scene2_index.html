<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div style="padding:20px;">
    <h1>场景2：JSBridge - load 事件触发</h1>
    <p>通过 javaScriptProxy 注入 jsbObj，前端在 window load 事件中调用 jsbObj.notifyToGet()，应用侧在 JSBridge 方法里获取高度。</p>
    <div style="height:250px;background:#d0e0ff;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:20px;">动态内容区块 250px</div>
    <div style="height:180px;background:#b0d0ff;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:20px;">动态内容区块 180px</div>
</div>
<script>
    window.addEventListener('load', function() {
        if (typeof jsbObj !== 'undefined') {
            jsbObj.notifyToGet();
        } else {
            console.info('jsbObj is undefined');
        }
    });
</script>
</body>
</html>

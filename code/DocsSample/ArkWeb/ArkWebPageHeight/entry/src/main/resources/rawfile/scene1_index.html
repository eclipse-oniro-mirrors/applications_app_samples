<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div style="padding:20px;">
    <h1>场景1：普通静态展示页面</h1>
    <p>这是一个普通静态网页，页面加载完成后 onPageEnd 回调中直接调用 getPageHeight() 获取高度。</p>
    <p>当前页面为静态内容，无需等待动态资源加载，onPageEnd 时刻获取的高度即为最终高度。</p>
    <div style="height:300px;background:#e0e0e0;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:20px;">静态内容区块 300px</div>
    <div style="height:200px;background:#c0c0c0;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:20px;">静态内容区块 200px</div>
    <div style="height:150px;background:#a0a0a0;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:20px;">静态内容区块 150px</div>
</div>
<script>
    window.addEventListener("load", function() {
        if (typeof jsbObj !== 'undefined') {
            jsbObj.notifyToGet();
        } else {
            console.info("jsbObj is undefined");
        }
    })
</script>
</body>
</html>
